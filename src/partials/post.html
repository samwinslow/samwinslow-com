<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }} — Sam Winslow</title>
    <meta name="description" content="{{ copy }}" />
    <link rel="canonical" href="{{{ url }}}" />

    <meta property="og:type" content="article" />
    <meta property="og:url" content="{{{ url }}}" />
    <meta property="og:title" content="{{ title }} — Sam Winslow" />
    <meta property="og:site_name" content="Sam Winslow" />
    <meta property="og:description" content="{{ copy }}" />
    <meta property="og:image" content="{{{ image_url }}}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ title }} — Sam Winslow" />
    <meta name="twitter:description" content="{{ copy }}" />
    <meta name="twitter:image" content="{{{ image_url }}}" />

    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/favicon-192x192.png" />

    <link rel="stylesheet" href="/css/index.css" />
  </head>
  <body>
    <header class="container">
      <a href="/" class="uppercase">Sam Winslow</a>
    </header>
    <main>
      <article class="container">
        <h1>{{ title }}</h1>
        <p class="post-meta">
          <time datetime="{{ date }}">{{ date }}</time>
          {{# copy }}<span class="post-copy"> — {{ copy }}</span>{{/ copy }}
        </p>
        {{{ body }}}
        <a href="/">&larr; back</a>
      </article>
    </main>
    <footer class="container">
      <p>&copy; {{ copyright_year }} Sam Winslow</p>
    </footer>
  </body>
</html>
